<div class="kawaii-wrapper">
  <div class="floating-items">
    <span class="kawaii-item cloud-1">☁️</span>
    <span class="kawaii-item cloud-2">☁️</span>
    <span class="kawaii-item star-1">✨</span>
    <span class="kawaii-item star-2">⭐</span>
    <span class="kawaii-item heart-1">💖</span>
    <span class="kawaii-item heart-2">🌸</span>
    <span class="kawaii-item bubble-1">🫧</span>
    <span class="kawaii-item bubble-2">🫧</span>
  </div>

  <div class="auth-card">
    <div class="avatar-header">
      <div class="avatar-circle">👧</div>
      <div class="avatar-circle">👦</div>
    </div>

    <h2>Perfil Infantil</h2>
    <p class="subtitle-text">Digite o seu nome e o Código da Família para começar a jogar!</p>

    <div class="form-group">
      <label>Nome da Criança</label>
      <input type="text" [(ngModel)]="nome" name="nome" placeholder="Ex.: Julia" maxlength="40" />
    </div>

    <div class="form-group">
      <label>Código da Família (6 caracteres)</label>
      <input
        type="text"
        [(ngModel)]="codigoFamilia"
        name="codigoFamilia"
        placeholder="Ex.: K4Y3SQ"
        maxlength="6"
        style="text-transform: uppercase; letter-spacing: 3px; font-weight: 700;"
      />
    </div>

    @if (erro()) {
      <p class="msg-erro">{{ erro() }}</p>
    }

    <button type="button" class="btn-painel" (click)="entrar()" [disabled]="carregando()">
      {{ carregando() ? 'Entrando...' : '🚀 Começar Jogos!' }}
    </button>

    <div class="back-container">
      <a routerLink="/selecao-perfil" class="btn-back-pill">
        ← Voltar à seleção de perfis
      </a>
    </div>
  </div>
</div>
