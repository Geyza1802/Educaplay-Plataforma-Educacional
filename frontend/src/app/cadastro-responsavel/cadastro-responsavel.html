<div class="kawaii-wrapper">
  <div class="floating-items">
    <span class="kawaii-item cloud-1">☁️</span>
    <span class="kawaii-item cloud-2">☁️</span>
    <span class="kawaii-item star-1">✨</span>
    <span class="kawaii-item star-2">⭐</span>
    <span class="kawaii-item heart-1">💖</span>
    <span class="kawaii-item heart-2">🌸</span>
    <span class="kawaii-item bubble-1">🫧</span>
    <span class="kawaii-item bubble-2">🫧</span>
  </div>

  <div class="auth-card">
    <div class="avatar-header">
      <div class="avatar-circle">📝</div>
      <div class="avatar-circle">👨‍👩‍👧</div>
    </div>

    <h2>Criar Conta de Responsável</h2>
    <p class="subtitle-text">Cadastre-se para gerenciar perfis e acompanhar o progresso das crianças.</p>

    <div class="form-group">
      <label>Nome do Responsável</label>
      <input type="text" [(ngModel)]="nome" name="nome" placeholder="Ex.: Maria Silva" maxlength="60" />
    </div>

    <div class="form-group">
      <label>E-mail</label>
      <input type="email" [(ngModel)]="email" name="email" placeholder="seuemail@exemplo.com" maxlength="100" />
    </div>

    <div class="form-group">
      <label>Senha (mínimo 6 caracteres)</label>
      <input type="password" [(ngModel)]="senha" name="senha" placeholder="••••••" maxlength="100" />
    </div>

    <div class="form-group">
      <label>Confirmar Senha</label>
      <input type="password" [(ngModel)]="confirmarSenha" name="confirmarSenha" placeholder="••••••" maxlength="100" />
    </div>

    <div class="form-group">
      <label>PIN de Segurança (4 números)</label>
      <input type="password" [(ngModel)]="pin" name="pin" placeholder="1234" maxlength="4" inputmode="numeric" />
    </div>

    @if (erro()) {
      <p class="msg-erro">{{ erro() }}</p>
    }

    <button type="button" class="btn-painel" (click)="cadastrar()" [disabled]="carregando()">
      {{ carregando() ? 'Cadastrando...' : '✨ Criar Conta' }}
    </button>

    <div class="back-container">
      <a routerLink="/login-responsavel" class="btn-back-pill">
        🔑 Já tem conta? Fazer login
      </a>
      <a routerLink="/selecao-perfil" class="btn-back-pill">
        ← Voltar à tela inicial
      </a>
    </div>
  </div>
</div>
